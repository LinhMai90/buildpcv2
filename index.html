<title>HACOM Homepage Demo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body
{
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.page-wrapper{
    width:100%;
}

.block{
    width:100%;
    padding:24px 0;
}

.block-title{
    width:1920px;
    margin:0 auto 10px;
    font-size:14px;
    font-weight:700;
    color:#666;
}

.block-inner{
    width: 1920px;
    margin:0 auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position:relative;
}

.single-image img{
    width:100%;
    height:auto;
    display:block;
}

.slider{
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
    align-items:flex-start;
    transition:height 0.25s ease;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slider img{
    width:100%;
    min-width:100%;
    height:auto;
    flex-shrink:0;
    display:block;
    scroll-snap-align:start;
}
/* =========================
   BLOCK 21 - FOOTER
========================= */

.footer-slider{
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
    align-items:flex-start;
    transition:height 0.25s ease;
}

.footer-slider::-webkit-scrollbar{
    display:none;
}

.footer-slider img{
    min-width:100%;
    width:100%;
    height:auto;
    display:block;
    flex-shrink:0;
    scroll-snap-align:start;
}

.nav-btn{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:48px;

    height:48px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.55);

    color:#fff;

    font-size:18px;

    cursor:pointer;

    z-index:99;

}
.block-21 .nav-btn{
    top:33%;
    transform:translateY(-50%);
}

.prev-btn{
    left:15px;
}

.next-btn{
    right:15px;
}

.nav-btn:hover{
    background:rgba(0,0,0,.8);
}

.block-25 .slider img{
    flex:0 0 1181px;
    width:1181px;
    min-width:1181px;
}

</style>

</head>

<body>

<div class="page-wrapper" id="homepage"></div>

<script>

/* =====================================
   CHỈ CẦN THÊM ẢNH TẠI ĐÂY
===================================== */

const blocks = {

    ],

    "https://drive.google.com/thumbnail?id=1NsEnRNHVUdWiLjkc-zNTLsEEPLwJ8FYb&sz=w3000",

	"https://drive.google.com/thumbnail?id=1_UcfWLC40JrYc9zjA42Ys-___tLLNuIe&sz=w3000",

    5:[

/* =====================================
   AUTO RENDER
===================================== */

// Tự động tối ưu link Google Drive sang CDN trực tiếp lh3 và giữ nguyên kích thước chất lượng gốc (sz=w3000 hoặc s0)
function formatImageUrl(url) {
    if (!url) return '';
    const match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
        const szMatch = url.match(/[?&]sz=([a-zA-Z0-9_-]+)/);
        const sz = szMatch ? szMatch[1] : 's0';
        return `https://lh3.googleusercontent.com/d/${match[1]}=${sz}`;
    }
    return url;
}

const homepage = document.getElementById('homepage');
let allHtml = '';

Object.keys(blocks).forEach(blockId => {

    const images = blocks[blockId];

    let html = '';

    html += `
        <div class="block">

            <div class="block-title">
                BLOCK ${String(blockId).padStart(2,'0')}
            </div>

            <div class="block-inner ${blockId == 21 ? 'block-21' : ''}">
    `;

    if(images.length === 1){
        const imgSrc = formatImageUrl(images[0]);
        html += `
            <div class="single-image">
                <img src="${imgSrc}" loading="lazy" referrerpolicy="no-referrer" alt="BLOCK ${String(blockId).padStart(2,'0')}">
            </div>
        `;

    }else{

        html += `

            <button
                class="nav-btn prev-btn"
                onclick="slidePrev('slider-${blockId}')">
                ◀
            </button>

	<div
   	 class="${blockId == 21 ? 'footer-slider' : 'slider'}"
 	 id="slider-${blockId}">
        `;

        images.forEach((img, idx) => {
            const imgSrc = formatImageUrl(img);
            html += `
                <img src="${imgSrc}" loading="lazy" referrerpolicy="no-referrer" alt="BLOCK ${String(blockId).padStart(2,'0')} - ${idx + 1}">
            `;
        });

        html += `
            </div>

            <button
                class="nav-btn next-btn"
                onclick="slideNext('slider-${blockId}')">
                ▶
            </button>
        `;
    }

    html += `
            </div>

        </div>
    `;

    allHtml += html;

});

homepage.innerHTML = allHtml;

/* =====================================
   TỰ ĐỘNG CĂN CHỈNH CHIỀU CAO (XÓA KHOẢNG TRẮNG DƯ THỪA)
===================================== */

function updateSliderHeight(slider) {
    if (!slider) return;
    const width = slider.offsetWidth || 1920;
    const index = Math.round(slider.scrollLeft / width);
    const imgs = slider.querySelectorAll('img');
    const currentImg = imgs[index];
    if (currentImg) {
        if (currentImg.offsetHeight > 0) {
            slider.style.height = currentImg.offsetHeight + 'px';
        } else if (currentImg.naturalWidth && currentImg.naturalHeight) {
            slider.style.height = Math.round(width * currentImg.naturalHeight / currentImg.naturalWidth) + 'px';
        }
    }
}

// Lắng nghe sự kiện tải ảnh và cuộn trang để cập nhật đúng chiều cao theo ảnh đang xem
document.querySelectorAll('.slider, .footer-slider').forEach(slider => {
    slider.querySelectorAll('img').forEach((img, idx) => {
        img.addEventListener('load', () => {
            const width = slider.offsetWidth || 1920;
            const activeIdx = Math.round(slider.scrollLeft / width);
            if (activeIdx === idx || !slider.style.height) {
                updateSliderHeight(slider);
            }
        });
    });

    let scrollTimeout;
    slider.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            updateSliderHeight(slider);
        }, 50);
    }, { passive: true });

    // Khởi tạo chiều cao ban đầu
    updateSliderHeight(slider);
});

window.addEventListener('resize', () => {
    document.querySelectorAll('.slider, .footer-slider').forEach(updateSliderHeight);
});

/* =====================================
   NEXT / PREV
===================================== */

function slideNext(id){
    const slider = document.getElementById(id);
    if (!slider) return;
    const width = slider.offsetWidth || 1920;
    const nextScroll = slider.scrollLeft + width;
    const nextIndex = Math.round(nextScroll / width);
    const imgs = slider.querySelectorAll('img');
    if (nextIndex < imgs.length && imgs[nextIndex]) {
        const img = imgs[nextIndex];
        if (img.offsetHeight > 0) {
            slider.style.height = img.offsetHeight + 'px';
        } else if (img.naturalWidth && img.naturalHeight) {
            slider.style.height = Math.round(width * img.naturalHeight / img.naturalWidth) + 'px';
        }
    }
    slider.scrollBy({
        left: width,
        behavior: 'smooth'
    });
}
// chien ẻyrty
function slidePrev(id){
    const slider = document.getElementById(id);
    if (!slider) return;
    const width = slider.offsetWidth || 1920;
    const prevScroll = Math.max(0, slider.scrollLeft - width);
    const prevIndex = Math.round(prevScroll / width);
    const imgs = slider.querySelectorAll('img');
    if (imgs[prevIndex]) {
        const img = imgs[prevIndex];
        if (img.offsetHeight > 0) {
            slider.style.height = img.offsetHeight + 'px';
        } else if (img.naturalWidth && img.naturalHeight) {
            slider.style.height = Math.round(width * img.naturalHeight / img.naturalWidth) + 'px';
        }
    }
    slider.scrollBy({
        left: -width,
        behavior: 'smooth'
    });
}
//chien
</script>
